<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" /> <!-- Orange-400 -->
      <stop offset="100%" stop-color="#c2410c" /> <!-- Orange-700 -->
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Background Squircle -->
  <rect width="512" height="512" rx="120" fill="#09090b" />

  <!-- Centered Guitar Body Group -->
  <g transform="translate(256, 260) scale(1.15)">
    <!-- Electric Guitar Body Shape (Abstract Symmetrical Double Cutaway) -->
    <path d="M -50,-130 
             C -60,-190 -120,-190 -150,-140 
             C -170,-100 -140,-40 -115,-5 
             C -135,60 -135,130 -70,170 
             C -30,195 30,195 70,170 
             C 135,130 135,60 115,-5 
             C 140,-40 170,-100 150,-140 
             C 120,-190 60,-190 50,-130 
             Z" 
          fill="url(#bodyGrad)" />
          
    <!-- Strings: 4 vertical lines for minimalist effect -->
    <g stroke="white" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9">
      <line x1="-18" y1="-130" x2="-18" y2="170" />
      <line x1="-6" y1="-130" x2="-6" y2="170" />
      <line x1="6" y1="-130" x2="6" y2="170" />
      <line x1="18" y1="-130" x2="18" y2="170" />
    </g>
  </g>
</svg>
