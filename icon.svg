<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/> <!-- Amber center -->
      <stop offset="100%" stop-color="#ea580c"/> <!-- Dark Orange rim -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background: Clean White Squircle -->
  <rect width="512" height="512" rx="110" fill="#ffffff"/>

  <!-- Guitar Body Group: Les Paul Style Single Cutaway -->
  <g transform="translate(256, 265)">
    <!-- 
       Body Silhouette 
       Asymmetric shape:
       - Left side: Rounded upper bout
       - Right side: Cutaway (horn)
       - Bottom: Wide rounded bout
    -->
    <path d="M -45,-210 
             L 45,-210 
             C 45,-210 45,-140 100,-120 
             C 125,-110 145,-70 145,20 
             C 145,130 90,200 0,200 
             C -90,200 -145,130 -145,20 
             C -145,-50 -120,-90 -90,-120 
             C -70,-140 -80,-170 -65,-190 
             C -60,-198 -55,-210 -45,-210 
             Z" 
          fill="url(#bodyGrad)"/>

    <!-- Pickguard (Optional, keeping it clean/modern without for now, or just hardware) -->

    <!-- Hardware Group: White elements -->
    <g fill="#ffffff">
        <!-- Neck Pickup (Humbucker rectangle) -->
        <rect x="-55" y="-130" width="110" height="28" rx="4" opacity="0.9"/>
        
        <!-- Bridge Pickup (Humbucker rectangle) -->
        <rect x="-55" y="-80" width="110" height="28" rx="4" opacity="0.9"/>

        <!-- Bridge (Tune-o-matic style thin bar) -->
        <rect x="-55" y="-30" width="110" height="12" rx="3"/>

        <!-- Tailpiece (Stopbar) -->
        <rect x="-55" y="0" width="110" height="12" rx="3"/>
        
        <!-- Toggle Switch (Upper Left) -->
        <circle cx="-95" cy="-145" r="10" opacity="0.9"/>
        
        <!-- Control Knobs (Classic 4 layout) -->
        <!-- Top Pair -->
        <circle cx="50" cy="40" r="14"/>
        <circle cx="95" cy="30" r="14"/>
        <!-- Bottom Pair -->
        <circle cx="60" cy="85" r="14"/>
        <circle cx="105" cy="75" r="14"/>
    </g>
    
    <!-- Strings (Subtle hints, just 6 thin lines fading out) -->
    <g stroke="#ffffff" stroke-width="2" opacity="0.5" stroke-linecap="round">
        <line x1="-45" y1="0" x2="-45" y2="-210"/>
        <line x1="-27" y1="0" x2="-27" y2="-210"/>
        <line x1="-9" y1="0" x2="-9" y2="-210"/>
        <line x1="9" y1="0" x2="9" y2="-210"/>
        <line x1="27" y1="0" x2="27" y2="-210"/>
        <line x1="45" y1="0" x2="45" y2="-210"/>
    </g>

  </g>
</svg>
