<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/> <!-- Amber -->
      <stop offset="100%" stop-color="#ea580c"/> <!-- Orange -->
    </linearGradient>
  </defs>

  <!-- Background: Clean White Squircle -->
  <rect width="512" height="512" rx="110" fill="#ffffff"/>

  <!-- Guitar Body Graphic -->
  <g transform="translate(256, 256)">
    <!-- Body Shape: Modern Stylized Cutaway -->
    <!-- Narrower neck (-45 to 45), Wide body (-160 to 160) for better proportions -->
    <path d="M -45,-230 
             L -45,-100
             C -130,-100 -170,-40 -170,50
             C -170,150 -90,210 0,210
             C 90,210 170,150 170,50
             C 170,-40 130,-100 45,-100
             L 45,-230 
             Z" 
          fill="url(#orangeGrad)"/>

    <!-- Sound Hole / Central Detail (White) -->
    <circle cx="0" cy="60" r="50" fill="#ffffff"/>

    <!-- Strings Representation (Negative Space) -->
    <g fill="#ffffff" opacity="0.6">
        <rect x="-18" y="-230" width="4" height="290" rx="2"/>
        <rect x="-6" y="-230" width="4" height="290" rx="2"/>
        <rect x="6" y="-230" width="4" height="290" rx="2"/>
        <rect x="18" y="-230" width="4" height="290" rx="2"/>
    </g>
    
    <!-- Bridge Detail -->
    <rect x="-50" y="140" width="100" height="12" rx="6" fill="#ffffff"/>
  </g>
</svg>
