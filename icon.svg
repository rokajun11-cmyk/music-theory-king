<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background Squircle -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Main Graphic: Guitar Pick Shape -->
  <g transform="translate(256, 266) scale(0.85)">
    <path d="M0 210 C -140 60, -180 -100, -180 -140 C -180 -210, -100 -210, 0 -210 C 100 -210, 180 -210, 180 -140 C 180 -100, 140 60, 0 210 Z" fill="white" filter="url(#shadow)"/>
    
    <!-- Negative Space: Fretboard -->
    <rect x="-35" y="-180" width="70" height="300" rx="4" fill="#f97316"/>
    
    <!-- Frets (White Lines crossing the orange fretboard) -->
    <rect x="-35" y="-120" width="70" height="6" fill="white" opacity="0.9"/>
    <rect x="-35" y="-50" width="70" height="6" fill="white" opacity="0.9"/>
    <rect x="-35" y="20" width="70" height="6" fill="white" opacity="0.9"/>
    <rect x="-35" y="90" width="70" height="6" fill="white" opacity="0.9"/>
    
    <!-- Strings (Vertical lines) -->
    <line x1="-18" y1="-180" x2="-18" y2="120" stroke="#ea580c" stroke-width="4"/>
    <line x1="0" y1="-180" x2="0" y2="120" stroke="#ea580c" stroke-width="4"/>
    <line x1="18" y1="-180" x2="18" y2="120" stroke="#ea580c" stroke-width="4"/>
  </g>
</svg>
